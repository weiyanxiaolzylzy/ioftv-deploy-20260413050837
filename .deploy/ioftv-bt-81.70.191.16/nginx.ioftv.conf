server {
    listen 8080;
    server_name 81.70.191.16 _;

    client_max_body_size 500m;

    root /www/wwwroot/ioftv/dist;
    index index.html;

    location = /ifc {
        return 301 /ifc/;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8890;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        send_timeout 600s;
    }

    location /pyapi/ {
        proxy_pass http://127.0.0.1:8890;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        send_timeout 600s;
    }

    location /uploads/ {
        alias /www/wwwroot/ioftv/server/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /banzu/ {
        alias /www/wwwroot/ioftv/banzu/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /public/ {
        alias /www/wwwroot/ioftv/public/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /wasm/ {
        alias /www/wwwroot/ioftv/public/static/js/wasm/;
        default_type application/wasm;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /ifc/ {
        alias /www/wwwroot/ioftv/ifc/dist/;
        try_files $uri $uri/ /ifc/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
